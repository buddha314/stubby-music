[package]
name = "spike_rack"
version = "0.1.0"
edition.workspace = true

[dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
audioadapter-buffers = "5"
firewheel = { version = "0.14.0", default-features = false, features = ["std", "scheduled_events", "spatial_basic_node", "glam-32"] }
fundsp = "0.23.0"
glam = { version = "0.32", default-features = false, features = ["std"] }
hrtf = "0.8.1"
spike_common = { version = "0.1.0", path = "../spike_common" }
