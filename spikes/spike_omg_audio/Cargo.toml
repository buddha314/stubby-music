[package]
name = "spike_omg_audio"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
audioadapter-buffers = "5"
firewheel = { version = "0.14.0", default-features = false, features = ["std"] }
omg-audio = { git = "https://github.com/JustGoscha/omg-audio", rev = "4f8ff13e48fb9e96a59b0b1a607b9d33ac01a869" }
omg-core = { git = "https://github.com/JustGoscha/omg-audio", rev = "4f8ff13e48fb9e96a59b0b1a607b9d33ac01a869" }
omg-dsp = { git = "https://github.com/JustGoscha/omg-audio", rev = "4f8ff13e48fb9e96a59b0b1a607b9d33ac01a869" }

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
