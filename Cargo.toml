[workspace]
resolver = "3"
members = ["crates/stubby_audio", "crates/stubby_game", "crates/stubby_recipes", "jackdaw"]
# Spikes remain isolated experiments. Game and editor adapter share Jackdaw's Bevy.
exclude = ["spikes"]

[workspace.package]
edition = "2024"

# Selected by the recorded Jackdaw revision; Cargo.lock pins its matching engine dependencies.
[workspace.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "ui"] }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
