[workspace]
resolver = "3"
default-members = ["crates/stubby_jackdaw"]
members = ["crates/stubby_audio", "crates/stubby_core", "crates/stubby_net", "crates/stubby_ui", "crates/bevy_stubby_audio", "crates/stubby_player", "crates/stubby_life", "crates/bevy_stubby_rack", "crates/stubby_world", "crates/stubby_streams", "crates/stubby_rack", "crates/stubby_game", "crates/stubby_recipes", "crates/stubby_economy", "crates/bevy_stubby_recipes", "crates/stubby_jackdaw", "crates/stubby_rules_server"]
# Both game entry points and the crafting adapter follow shared Jackdaw.
exclude = ["spikes"]

[workspace.package]
edition = "2024"

# Bevy main, as Jackdaw main uses; Cargo.lock pins the revision our Jackdaw fork locks
# (tools/jackdaw.sh sync).
[workspace.dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
# Physics (AGENTS.md stack). Mesh colliders for shapes primitives cannot fit (pool, banks, dug
# channels); prefer primitives. debug-plugin draws colliders when enabled.
avian3d = { version = "~0.8.0", default-features = false, features = ["3d", "parry-f32", "parallel", "collider-from-mesh", "debug-plugin"] }
# The player's inputs as actions (BEI), and the movement spike's alternative controller
# (add-multiplayer-and-menus 2.3), as the us-outpost-31 template uses them. Neither has a
# Bevy-main release: [patch.crates-io] swaps in our forks (bevy_main_forks.json).
bevy_enhanced_input = "0.27.2"
bevy_ahoy = "0.3.0"
# Multiplayer (add-multiplayer-and-menus): host-server and clients with prediction, as the
# us-outpost-31 template uses it. Every lightyear crate comes from our Bevy-main fork of its
# workspace ([patch.crates-io]). Steam's transport joins with phase 5.
lightyear = { version = "0.31.0", default-features = false, features = ["std", "client", "server", "replication", "prediction", "interpolation", "frame_interpolation", "udp", "netcode", "crossbeam", "input_bei", "avian3d"] }

# Jackdaw crates from the buddha314 fork, at the revision compatibility.json records
# (tools/jackdaw.sh sync rewrites `rev`; tools/jackdaw.sh link builds against ~/src/jackdaw).
jackdaw_terrain = { git = "https://github.com/buddha314/jackdaw.git", rev = "39af09e36a272ece810353604ce85823067f596a", default-features = false }
jackdaw_prefab = { git = "https://github.com/buddha314/jackdaw.git", rev = "39af09e36a272ece810353604ce85823067f596a" }
jackdaw_runtime = { git = "https://github.com/buddha314/jackdaw.git", rev = "39af09e36a272ece810353604ce85823067f596a" }
jackdaw_scene_types = { git = "https://github.com/buddha314/jackdaw.git", rev = "39af09e36a272ece810353604ce85823067f596a" }
jackdaw_bsn = { git = "https://github.com/buddha314/jackdaw.git", rev = "39af09e36a272ece810353604ce85823067f596a" }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Crates with no Bevy-main release, from our generated forks (bevy_main_forks.json).
[patch.crates-io]
avian3d = { git = "https://github.com/buddha314/avian", branch = "bevy-main" }
bevy_heavy = { git = "https://github.com/buddha314/bevy_heavy", branch = "bevy-main" }
bevy_transform_interpolation = { git = "https://github.com/buddha314/bevy_transform_interpolation", branch = "bevy-main" }
