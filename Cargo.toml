[workspace]
resolver = "3"
members = ["crates/stubby_audio", "crates/stubby_core", "crates/bevy_stubby_audio", "crates/stubby_player", "crates/stubby_life", "crates/stubby_rack", "crates/stubby_game", "crates/stubby_recipes", "crates/bevy_stubby_recipes", "crates/stubby_jackdaw"]
# Both game entry points and the crafting adapter follow shared Jackdaw.
exclude = ["spikes"]

[workspace.package]
edition = "2024"

# Bevy main, as Jackdaw main uses; Cargo.lock pins the revision our Jackdaw fork locks
# (tools/jackdaw.sh sync).
[workspace.dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }
# Physics (AGENTS.md stack). Mesh colliders for shapes primitives cannot fit (pool, banks, dug
# channels); prefer primitives. debug-plugin draws colliders when enabled.
avian3d = { version = "~0.8.0", default-features = false, features = ["3d", "parry-f32", "parallel", "collider-from-mesh", "debug-plugin"] }

# Jackdaw crates from the buddha314 fork, at the revision compatibility.json records
# (tools/jackdaw.sh sync rewrites `rev`; tools/jackdaw.sh link builds against ~/src/jackdaw).
jackdaw_terrain = { git = "https://github.com/buddha314/jackdaw.git", rev = "3c891ed14bebee8dda6dda9ddc18b29a7000296e", default-features = false }
jackdaw_prefab = { git = "https://github.com/buddha314/jackdaw.git", rev = "3c891ed14bebee8dda6dda9ddc18b29a7000296e" }
jackdaw_runtime = { git = "https://github.com/buddha314/jackdaw.git", rev = "3c891ed14bebee8dda6dda9ddc18b29a7000296e" }
jackdaw_scene_types = { git = "https://github.com/buddha314/jackdaw.git", rev = "3c891ed14bebee8dda6dda9ddc18b29a7000296e" }
jackdaw_bsn = { git = "https://github.com/buddha314/jackdaw.git", rev = "3c891ed14bebee8dda6dda9ddc18b29a7000296e" }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Crates with no Bevy-main release, from our generated forks (bevy_main_forks.json).
[patch.crates-io]
avian3d = { git = "https://github.com/buddha314/avian", branch = "bevy-main" }
bevy_heavy = { git = "https://github.com/buddha314/bevy_heavy", branch = "bevy-main" }
bevy_transform_interpolation = { git = "https://github.com/buddha314/bevy_transform_interpolation", branch = "bevy-main" }
glam_matrix_extras = { git = "https://github.com/buddha314/glam_matrix_extras", branch = "bevy-main" }
