avian_pickup = { git = "https://github.com/buddha314/avian_pickup", branch = "bevy-main" }
avian2d = { git = "https://github.com/buddha314/avian", branch = "bevy-main" }
lightyear = { git = "https://github.com/buddha314/lightyear", branch = "bevy-main" }
