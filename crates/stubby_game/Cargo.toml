[package]
name = "stubby_game"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["spatial-audio"]
dev = ["bevy/dynamic_linking"]
spatial-audio = ["stubby_audio/audionimbus"]
omg-audio = ["stubby_audio/omg_audio"]

[dependencies]
hound = "~3.5"
jackdaw_terrain.workspace = true
stubby_recipes = { path = "../stubby_recipes" }
bevy_stubby_recipes = { path = "../bevy_stubby_recipes" }
stubby_audio = { path = "../stubby_audio" }
stubby_rack = { path = "../stubby_rack" }
stubby_core = { path = "../stubby_core" }
stubby_ui = { path = "../stubby_ui" }
bevy_stubby_audio = { path = "../bevy_stubby_audio" }
stubby_player = { path = "../stubby_player" }
# Multiplayer: the session (stubby_net), and ahoy's types the glue registers for rollback.
stubby_net = { path = "../stubby_net" }
stubby_steam = { path = "../stubby_steam" }
bevy_ahoy.workspace = true
bevy_enhanced_input.workspace = true
stubby_life = { path = "../stubby_life" }
bevy_stubby_rack = { path = "../bevy_stubby_rack" }
stubby_world = { path = "../stubby_world" }
stubby_streams = { path = "../stubby_streams" }
serde = { version = "~1.0", features = ["derive"] }
bevy.workspace = true
# bevy_remote: dev builds serve Bevy's remote protocol on 127.0.0.1 for the rules designer
# (add-crafting-designer 3.8); release builds never add the plugin. bevy_settings saves
# the player's settings (src/settings.rs, add-multiplayer-and-menus).
bevy.features = ["3d", "ui", "mesh_picking", "bevy_remote", "bevy_settings"]
avian3d.workspace = true
half = "~2.7.1"
serde_json = "~1.0"
png = "~0.18"

[dev-dependencies]
gltf = { version = "~1.4", features = ["extras"] }
tempfile = "~3.27"
