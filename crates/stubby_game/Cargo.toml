[package]
name = "stubby_game"
version = "0.1.0"
edition.workspace = true

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "~0.20.1", default-features = false, features = ["3d"] }
half = "~2.7.1"
serde_json = "~1.0"
png = "~0.18"
stubby_audio = { version = "0.1.0", path = "../stubby_audio" }

[dev-dependencies]
gltf = { version = "~1.4", features = ["extras"] }
tempfile = "~3.27"
