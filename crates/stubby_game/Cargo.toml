[package]
name = "stubby_game"
version = "0.1.0"
edition.workspace = true

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
stubby_recipes = { path = "../stubby_recipes" }
stubby_audio = { path = "../stubby_audio" }
serde = { version = "~1.0", features = ["derive"] }
bevy = { version = "~0.20.1", default-features = false, features = ["3d", "ui"] }
half = "~2.7.1"
serde_json = "~1.0"
png = "~0.18"

[dev-dependencies]
gltf = "~1.4"
tempfile = "~3.27"
