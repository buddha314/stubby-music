[package]
name = "stubby_game"
version = "0.1.0"
edition.workspace = true

[features]
dev = ["bevy/dynamic_linking"]
# Set only by Jackdaw's adapter, which compiles the plugin's source as a module.
embedded_recipes_plugin = []

[dependencies]
jackdaw_terrain = { path = "../../../jackdaw/crates/jackdaw_terrain", default-features = false }
stubby_recipes = { path = "../stubby_recipes" }
bevy_stubby_recipes = { path = "../bevy_stubby_recipes" }
stubby_audio = { path = "../stubby_audio" }
serde = { version = "~1.0", features = ["derive"] }
bevy.workspace = true
bevy.features = ["3d", "ui", "mesh_picking"]
avian3d.workspace = true
half = "~2.7.1"
serde_json = "~1.0"
png = "~0.18"
jackdaw_runtime = { path = "../../../jackdaw/crates/jackdaw_runtime", features = ["pie"] }
jackdaw_avian_integration = { path = "../../../jackdaw/integrations/physics/jackdaw_avian_integration" }

[dev-dependencies]
gltf = { version = "~1.4", features = ["extras"] }
tempfile = "~3.27"
