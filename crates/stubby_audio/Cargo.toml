[package]
name = "stubby_audio"
version = "0.1.0"
edition = "2024"
description = "Realtime modular-synth audio engine for stubby-music, independent of the Bevy engine"
license = "MIT"
repository = "https://github.com/buddha314/stubby-music"
readme = "README.md"
# Lives in the game's repo until it has a second user (see README).
publish = false

[dependencies]
arc-swap = { version = "1.8.2", optional = true }
audioadapter-buffers = "5"
audionimbus = { version = "=0.17.0", default-features = false, features = ["dynamic", "linking-dynamic", "wiring"], optional = true }
firewheel = { version = "0.14.0", default-features = false, features = ["std", "cpal", "scheduled_events", "tracing", "sampler_node", "spatial_basic_node", "peak_meter_node"] }
fundsp = "0.23.0"
rtrb = "0.4.1"
thiserror = "2"

[features]
audionimbus = ["dep:arc-swap", "dep:audionimbus"]

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }

# The audio thread must never panic: a panic there kills sound for the session.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
