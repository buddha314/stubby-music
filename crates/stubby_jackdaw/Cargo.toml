[package]
name = "stubby_jackdaw"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this package for saved prefab type paths; dependency versions belong to the root workspace.
[features]
default = ["spatial-audio"]
dev = ["bevy/dynamic_linking", "stubby_game/dev"]
spatial-audio = ["stubby_game/spatial-audio"]

[dependencies]
# The game itself, as an ordinary dependency (split-game-into-systems step 1); this
# package adds only the editor bridge and Jackdaw's runtime.
stubby_game = { path = "../stubby_game" }
bevy_stubby_audio = { path = "../bevy_stubby_audio" }
jackdaw_prefab.workspace = true
bevy.workspace = true
bevy.features = ["3d", "ui", "mesh_picking"]
jackdaw_runtime = { workspace = true, features = ["pie"] }
jackdaw_scene_types.workspace = true
serde_json = "~1.0"

[dev-dependencies]
stubby_core = { path = "../stubby_core" }
gltf = "~1.4"
tempfile = "~3.27"
jackdaw_bsn.workspace = true
