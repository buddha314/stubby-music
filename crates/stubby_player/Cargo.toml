[package]
name = "stubby_player"
version = "0.1.0"
edition.workspace = true
description = "The first-person player: movement, look, the hand, and what E reaches"
license = "MIT"
publish = false

# A system crate (split-game-into-systems): Bevy, physics and stubby_core only.
[dependencies]
stubby_core = { path = "../stubby_core" }
# The world bus level the field recorder's meter shows (sync-recorder-feedback).
bevy_stubby_audio = { path = "../bevy_stubby_audio" }
bevy.workspace = true
bevy.features = ["3d", "ui", "mesh_picking"]
avian3d.workspace = true
# Inputs as actions, so they can run in the fixed step (and later travel over the network),
# and the spike's alternative controller (add-multiplayer-and-menus 2.3).
bevy_enhanced_input.workspace = true
bevy_ahoy.workspace = true
# The white outline on the pickup E is aimed at (sync-targeting-and-compass); a Bevy-main fork
# (bevy_main_forks.json).
bevy_mod_outline = { version = "~0.14.0", default-features = false }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

