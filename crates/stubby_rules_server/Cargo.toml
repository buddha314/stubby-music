[package]
name = "stubby_rules_server"
version = "0.1.0"
edition.workspace = true
publish = false
description = "The rules designer: a local web page over stubby_recipes' editing model (add-crafting-designer)."

# A tool, outside the game's layers: the rules core and an HTTP server, never Bevy or the game.
[dependencies]
stubby_recipes = { path = "../stubby_recipes" }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
tiny_http = "~0.12"
