[package]
name = "bevy_stubby_rack"
version = "0.1.0"
edition.workspace = true
description = "The rack screen every machine is configured on: modules, cables, knobs"
license = "MIT"
publish = false

# A system crate (split-game-into-systems): its core (stubby_rack), services and Bevy.
[dependencies]
stubby_rack = { path = "../stubby_rack" }
stubby_audio = { path = "../stubby_audio" }
bevy_stubby_audio = { path = "../bevy_stubby_audio" }
stubby_core = { path = "../stubby_core" }
stubby_ui = { path = "../stubby_ui" }
bevy.workspace = true
bevy.features = ["3d", "ui", "mesh_picking"]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
half = "~2.7.1"

[dev-dependencies]
stubby_player = { path = "../stubby_player" }
gltf = { version = "~1.4", features = ["extras"] }
