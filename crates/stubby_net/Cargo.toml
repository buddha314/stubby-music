[package]
name = "stubby_net"
version = "0.1.0"
edition.workspace = true
description = "Multiplayer sessions: hosting, joining, and what every peer registers alike"
license = "MIT"
publish = false

# A service crate (split-game-into-systems): the lightyear session, nothing about any one
# system. Systems never import lightyear; the game's glue registers what they replicate.
[dependencies]
stubby_core = { path = "../stubby_core" }
bevy.workspace = true
avian3d.workspace = true
lightyear.workspace = true
serde = { version = "~1.0", features = ["derive"] }
