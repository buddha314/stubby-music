# jackdaw project settings.

# Optional name of your game's root Bevy Plugin (for setup / `jd doctor`).
# Play runs your cargo binary; add the plugin from `main.rs`.
# plugin = "GamePlugin"

# The workspace member jackdaw builds as the game.
package = "stubby_game"

# Recorded when this project was set up. Jackdaw compares these on
# open so an editor upgrade is reported instead of surfacing as a
# build failure.
[jackdaw]
version = "0.21.0-dev"
bevy = "main"
channel = "bleeding-edge"
bevy_rev = "c9c397ba1a73e6cfffe957318e0359330b701865"

# Optional jackdaw modules this project uses. Change them from the
# editor (File > Modules) so the game's Cargo.toml follows.
[modules]
physics = true
navmesh = false
multiplayer = false

[[run]]
name = "Play"
