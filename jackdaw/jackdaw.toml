plugin = "DesertPlugin"
package = "stubby_jackdaw"

[jackdaw]
version = "0.20.1-rc.1"
bevy = "0.20"

[[run]]
name = "Desert opening"
args = ["--seed=42"]

[[run]]
name = "Desert opening + audio demo"
args = ["--seed=42", "--audio-demo"]

[[run]]
name = "Live listen: clock + square"
args = ["--seed=42", "--module-demo"]

[[run]]
name = "Review: dusk and replenishment"
args = ["--seed=42", "--replenishment-review=/tmp/stubby-replenishment-review"]

[[run]]
name = "Review: placed prefab runtime"
args = ["--seed=42", "--scene=review_prefab_runtime.bsn", "--prefab-review=/tmp/stubby-prefab-review"]
