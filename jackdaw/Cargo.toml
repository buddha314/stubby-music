[package]
name = "stubby_jackdaw"
version = "0.1.0"
edition = "2024"
publish = false

# Jackdaw's development Bevy is isolated from the released game engine.
[workspace]

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = ["3d"] }
jackdaw_runtime = { path = "/home/buddha/src/jackdaw/crates/jackdaw_runtime", features = ["pie"] }
half = "~2.7.1"
serde_json = "~1.0"
png = "~0.18"

[profile.dev]
debug = 0

[dev-dependencies]
gltf = "~1.4"
tempfile = "~3.27"
