[package]
name = "stubby_jackdaw"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this package for saved prefab type paths; dependency versions belong to the root workspace.
[features]
default = ["embedded_recipes_plugin"]
dev = ["bevy/dynamic_linking"]
# The game's crafting plugin, compiled as a module against this Bevy revision.
embedded_recipes_plugin = []

[dependencies]
jackdaw_prefab = { path = "../../jackdaw/crates/jackdaw_prefab" }
stubby_recipes = { path = "../crates/stubby_recipes" }
stubby_audio = { path = "../crates/stubby_audio" }
serde = { version = "~1.0", features = ["derive"] }
bevy.workspace = true
bevy.features = ["3d", "ui", "mesh_picking"]
jackdaw_runtime = { path = "../../jackdaw/crates/jackdaw_runtime", features = ["pie"] }
jackdaw_scene_types = { path = "../../jackdaw/crates/jackdaw_scene_types" }
half = "~2.7.1"
serde_json = "~1.0"
png = "~0.18"
# Bevy-free, so it builds unchanged against the editor's Bevy revision.

[dev-dependencies]
gltf = "~1.4"
tempfile = "~3.27"
jackdaw_bsn = { path = "../../jackdaw/crates/jackdaw_bsn" }
