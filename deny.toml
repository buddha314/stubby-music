# cargo-deny: `cargo deny check` runs all four sections; CI and tools/ci_local.sh run it.
#
# [advisories], [licenses] and [sources] follow Bevy's own deny.toml: known security
# advisories, an allow-list of licenses (this repository is public), and only the
# registries and git hosts we mean to build from.
#
# [bans]: crate layering (split-game-into-systems).
#
#   cores     stubby_audio, stubby_rack, stubby_recipes, stubby_economy (never Bevy; see tools/ci_local.sh)
#   services  stubby_core, stubby_ui, bevy_stubby_audio, stubby_net
#   systems   bevy_stubby_rack, bevy_stubby_recipes, stubby_player, stubby_life,
#             stubby_world, stubby_streams
#   game      stubby_game, stubby_jackdaw
#   tools     stubby_rules_server (the rules designer: a core and an HTTP server, never Bevy
#             or the game; nothing depends on it)
#
# `wrappers` lists the only crates allowed to depend directly on a crate. Systems are used
# only by the game; a system's own core only by that system and the game; services only by
# systems and the game (so no core reaches up). A new crate gets a line here.

[graph]
# Tests may assemble several systems; the layering is about what ships.
exclude-dev = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "bevy_stubby_rack", wrappers = ["stubby_game", "stubby_jackdaw"], reason = "systems never depend on each other" },
    { crate = "bevy_stubby_recipes", wrappers = ["stubby_game", "stubby_jackdaw"], reason = "systems never depend on each other" },
    { crate = "stubby_player", wrappers = ["stubby_game", "stubby_jackdaw"], reason = "systems never depend on each other" },
    { crate = "stubby_life", wrappers = ["stubby_game", "stubby_jackdaw"], reason = "systems never depend on each other" },
    { crate = "stubby_world", wrappers = ["stubby_game", "stubby_jackdaw"], reason = "systems never depend on each other" },
    { crate = "stubby_streams", wrappers = ["stubby_game", "stubby_jackdaw"], reason = "systems never depend on each other" },
    { crate = "stubby_rack", wrappers = ["bevy_stubby_rack", "stubby_game", "stubby_jackdaw"], reason = "the rack system's own core" },
    { crate = "stubby_recipes", wrappers = ["bevy_stubby_recipes", "stubby_game", "stubby_jackdaw", "stubby_rules_server"], reason = "the crafting system's own core, and the rules designer's" },
    { crate = "stubby_economy", wrappers = ["stubby_game", "stubby_jackdaw", "stubby_settlement"], reason = "settlement economy core" },
    { crate = "stubby_core", wrappers = ["bevy_stubby_rack", "bevy_stubby_recipes", "stubby_player", "stubby_life", "stubby_world", "stubby_streams", "stubby_net", "stubby_game", "stubby_jackdaw"], reason = "services are used by systems and the game, never by cores" },
    { crate = "stubby_net", wrappers = ["stubby_game", "stubby_jackdaw"], reason = "the multiplayer session; only the game's glue says what systems replicate (add-multiplayer-and-menus)" },
    { crate = "stubby_ui", wrappers = ["bevy_stubby_rack", "bevy_stubby_recipes", "stubby_player", "stubby_life", "stubby_world", "stubby_streams", "stubby_game", "stubby_jackdaw"], reason = "services are used by systems and the game, never by cores" },
    { crate = "bevy_stubby_audio", wrappers = ["bevy_stubby_rack", "bevy_stubby_recipes", "stubby_player", "stubby_life", "stubby_world", "stubby_streams", "stubby_game", "stubby_jackdaw"], reason = "services are used by systems and the game, never by cores" },
]

[advisories]
version = 2
ignore = [
    # ttf-parser (Bevy's text rendering) is unmaintained with no replacement yet; Bevy
    # ignores the same advisory. See https://rustsec.org/advisories/RUSTSEC-2026-0192
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, reached through Bevy; no safe upgrade" },
    # chrono, unmaintained (not a vulnerability), reached through lightyear; no safe upgrade.
    { id = "RUSTSEC-2026-0543", reason = "chrono, unmaintained, reached through lightyear; no safe upgrade" },
]

[licenses]
version = 2
# Bevy's allow-list.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]
# MPL-2.0 is file-level copyleft: using these crates unmodified is fine; changing their
# files and distributing them would oblige us to share those files. Named one by one, so a
# new MPL dependency still fails. symphonia (audio decoding, via Bevy/Firewheel) as in
# Bevy's own deny.toml; triple_buffer through Firewheel, our audio engine.
exceptions = [
    { name = "symphonia", allow = ["MPL-2.0"] },
    { name = "symphonia-bundle-flac", allow = ["MPL-2.0"] },
    { name = "symphonia-bundle-mp3", allow = ["MPL-2.0"] },
    { name = "symphonia-codec-aac", allow = ["MPL-2.0"] },
    { name = "symphonia-codec-adpcm", allow = ["MPL-2.0"] },
    { name = "symphonia-codec-alac", allow = ["MPL-2.0"] },
    { name = "symphonia-codec-pcm", allow = ["MPL-2.0"] },
    { name = "symphonia-codec-vorbis", allow = ["MPL-2.0"] },
    { name = "symphonia-core", allow = ["MPL-2.0"] },
    { name = "symphonia-format-caf", allow = ["MPL-2.0"] },
    { name = "symphonia-format-isomp4", allow = ["MPL-2.0"] },
    { name = "symphonia-format-mkv", allow = ["MPL-2.0"] },
    { name = "symphonia-format-ogg", allow = ["MPL-2.0"] },
    { name = "symphonia-format-riff", allow = ["MPL-2.0"] },
    { name = "symphonia-metadata", allow = ["MPL-2.0"] },
    { name = "symphonia-utils-xiph", allow = ["MPL-2.0"] },
    { name = "triple_buffer", allow = ["MPL-2.0"] },
]

[licenses.private]
# Our own unpublished crates are not licensed packages; the repository's LICENSE covers them.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Bevy main, our buddha314 forks, and the exact OMG upstream used only by the
# opt-in spatial-audio evaluation feature (pinned in crates/stubby_audio/Cargo.toml).
allow-git = ["https://github.com/bevyengine/bevy", "https://github.com/JustGoscha/omg-audio"]

[sources.allow-org]
github = ["buddha314"]
