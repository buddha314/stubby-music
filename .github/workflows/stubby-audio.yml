name: stubby_audio

# Builds and tests the audio engine crate by itself, so it never gains a hidden
# dependency on the rest of the workspace (it should stay ready to split out).
on:
  push:
    branches: [main]
    paths:
      - "crates/stubby_audio/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "compatibility.json"
      - "crates/stubby_jackdaw/Cargo.toml"
      - "jackdaw.toml"
      - "crates/stubby_game/Cargo.toml"
      - "crates/bevy_stubby_recipes/Cargo.toml"
      - "tools/*jackdaw_versions.py"
      - "tools/*check_layers.py"
      - "crates/*/Cargo.toml"
      - ".github/workflows/stubby-audio.yml"
  pull_request:
    paths:
      - "crates/stubby_audio/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "compatibility.json"
      - "crates/stubby_jackdaw/Cargo.toml"
      - "jackdaw.toml"
      - "crates/stubby_game/Cargo.toml"
      - "crates/bevy_stubby_recipes/Cargo.toml"
      - "tools/*jackdaw_versions.py"
      - "tools/*check_layers.py"
      - "crates/*/Cargo.toml"
      - ".github/workflows/stubby-audio.yml"

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
        with:
          path: game
      - name: Read selected Jackdaw and Rust revisions
        id: versions
        run: |
          python3 - <<'PYVERSIONS' >> "$GITHUB_OUTPUT"
          import json
          record = json.load(open('compatibility.json'))
          print('jackdaw=' + record['jackdaw']['revision'])
          print('rust=' + record['rust'])
          PYVERSIONS
      # Jackdaw crates are git dependencies pinned in Cargo.toml; no sibling checkout needed.
      - name: Fork drift (warning only)
        run: |
          pinned=${{ steps.versions.outputs.jackdaw }}
          head=$(git ls-remote https://github.com/buddha314/jackdaw.git refs/heads/main | cut -f1)
          if [ -n "$head" ] && [ "$head" != "$pinned" ]; then
            echo "::warning::Jackdaw pin $pinned is behind buddha314/jackdaw main ($head). Run tools/jackdaw.sh sync."
          fi
      - name: Version consistency
        run: python3 tools/check_jackdaw_versions.py
      - name: Install ALSA headers (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: stubby-audio
          workspaces: game -> target
      - name: Version-check regression tests
        run: python3 tools/test_jackdaw_versions.py
      - name: Layer rules
        run: python3 tools/test_check_layers.py
      - name: Layer check (split-game-into-systems)
        run: python3 tools/check_layers.py
      - name: Active Bevy graph
        run: |
          cargo tree --color never --workspace --locked -e normal,build,dev --prefix none --format '{p}' > "$RUNNER_TEMP/bevy-tree.txt"
          python3 tools/check_jackdaw_versions.py --tree "$RUNNER_TEMP/bevy-tree.txt"
      - name: Format
        run: cargo fmt -p stubby_audio --check
      - name: Clippy
        run: cargo clippy -p stubby_audio --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p stubby_audio --locked
      - name: No dependency on other workspace crates
        run: |
          deps=$(cargo tree -p stubby_audio -e normal,build --prefix none --format '{p}' --locked \
            | grep -F "$GITHUB_WORKSPACE" | grep -v '^stubby_audio ' || true)
          if [ -n "$deps" ]; then echo "stubby_audio depends on workspace crates:"; echo "$deps"; exit 1; fi
          if cargo tree -p stubby_audio -e normal --prefix none --locked | grep -E '^bevy( |_app |_ecs |_render |_asset )'; then
            echo "stubby_audio must not depend on the Bevy engine"; exit 1
          fi
